<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}hazreq{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('dashboard') }}" class="brand">hazreq</a>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if nav == 'home' else '' }}">Home</a>
      <a href="{{ url_for('new_request') }}" class="{{ 'active' if nav == 'new' else '' }}">New Request</a>
      <a href="{{ url_for('list_requests') }}" class="{{ 'active' if nav == 'history' else '' }}">History</a>
      <a href="{{ url_for('list_mips') }}" class="{{ 'active' if nav == 'mips' else '' }}">MIPs</a>
      <a href="{{ url_for('list_spmigs') }}" class="{{ 'active' if nav == 'spmigs' else '' }}">SPMIGs</a>
      <a href="{{ url_for('admin_home') }}" class="{{ 'active' if nav == 'admin' else '' }}">Admin</a>
    </nav>
  </header>
  <main>
    {% if flash %}
      <div class="flash {{ flash.kind }}">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
